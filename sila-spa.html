<style>
/* ====== نظام التصميم المشترك ====== */
:root{
  --bg: #FAF7F2; --ink: #202B26; --ink-soft: #4C5850; --ink-faint: #7C8A81;
  --amber: #C98A3E; --amber-deep: #A8722F; --amber-glow: rgba(201,138,62,0.20);
  --sage: #6E8065; --divider: rgba(32,43,38,0.09); --whatsapp: #4C7A5E;
  --danger: #B24B3C; --danger-soft: rgba(178,75,60,0.09); --card: #F2EDE3;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --ease-calm: cubic-bezier(.32,.08,.22,1); --ease-out-soft: cubic-bezier(.16,.8,.3,1);
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-pill:100px;
}
*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; background: radial-gradient(ellipse 600px 420px at 50% 0%, rgba(201,138,62,0.035), transparent 70%), var(--bg);
  color: var(--ink); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3,p{ margin:0; } a{ color:inherit; text-decoration:none; } button{ font-family:inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; border-radius:8px; }
.device{ max-width:430px; margin:0 auto; min-height:100vh; position:relative; padding-bottom: var(--sp-12); }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding: var(--sp-4) var(--sp-5) 0; gap: var(--sp-3); }
.icon-btn{ width:40px; height:40px; flex:0 0 40px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  background:none; border:none; padding:0; cursor:pointer; border-radius:50%; transition:background .2s ease, transform .25s var(--ease-calm); }
.icon-btn:active{ transform:scale(0.92); }
.icon-btn svg{ width:19px; height:19px; }
.topbar-title{ font-family:'Amiri',serif; font-size:18px; font-weight:700; }
.whisper{ font-size:12.5px; color:var(--amber-deep); background:rgba(201,138,62,0.09); padding:6px 14px; border-radius:var(--r-pill);
  font-weight:500; text-align:center; line-height:1.5; box-shadow:0 1px 2px rgba(168,114,47,0.06); display:inline-block; }

<div class="device" id="app"></div>

<script>
/* ==========================================================================
   طبقة البيانات والمنطق المشترك (وحدة Sila)
   ========================================================================== */
window.Sila = (function(){
  const KEYS = { people:'sila:people:v2', settings:'sila:settings', onboarding:'sila:onboardingDone' };
  const CATEGORY_DEFAULTS = {
    parents:{label:'الوالدان',weight:5,interval:3}, siblings:{label:'الإخوة',weight:4,interval:7},
    relatives:{label:'الأقارب',weight:3,interval:21}, friends:{label:'الأصدقاء',weight:3,interval:14},
    coworkers:{label:'زملاء العمل',weight:2,interval:30}
  };
  const CATEGORY_ORDER = ['parents','siblings','relatives','friends','coworkers'];
  const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function toArabicDigits(n){ return String(n).replace(/[0-9]/g, d => ARABIC_DIGITS[+d]); }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function parseLocalDate(dateStr){ const [y,m,d]=dateStr.split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
  function safeParse(raw, fb){ try{ return raw?JSON.parse(raw):fb; }catch(e){ return fb; } }
  function getPeople(){ return safeParse(localStorage.getItem(KEYS.people), []); }
  function savePeople(list){ localStorage.setItem(KEYS.people, JSON.stringify(list)); }
  function getSettings(){ return Object.assign({calendarDefault:'gregorian', onboardingDone:false}, safeParse(localStorage.getItem(KEYS.settings), {})); }
  function saveSettings(s){ localStorage.setItem(KEYS.settings, JSON.stringify(s)); }
  function uid(){ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,9); }
  function getPerson(id){ return getPeople().find(p=>p.id===id) || null; }
  function getByCategory(type){ return getPeople().filter(p=>p.relationship_type===type); }
  function addPerson(data){
    const list = getPeople();
    const def = CATEGORY_DEFAULTS[data.relationship_type] || CATEGORY_DEFAULTS.friends;
    const person = { id:uid(), name:data.name.trim(), relationship_type:data.relationship_type, gender:data.gender||'',
      phone:data.phone||'', whatsapp:data.whatsapp||data.phone||'', alive:data.alive!==false,
      importance_weight:data.importance_weight||def.weight, interval_days:data.interval_days||def.interval,
      birthDate:data.birthDate||'', lastContact:null, memories:[],
      occasions: data.birthDate ? [{id:uid(), label:'عيد ميلاد', date:data.birthDate, recurring:true}] : [],
      createdAt:new Date().toISOString() };
    list.push(person); savePeople(list); return person;
  }
  function updatePerson(id, data){
    const list = getPeople(); const idx = list.findIndex(p=>p.id===id); if(idx===-1) return null;
    const p = list[idx];
    p.name=data.name.trim(); p.relationship_type=data.relationship_type; p.gender=data.gender||'';
    p.phone=data.phone||''; p.whatsapp=data.whatsapp||data.phone||''; p.alive=data.alive!==false;
    p.importance_weight=data.importance_weight; p.interval_days=data.interval_days;
    if(data.birthDate){
      const existing = p.occasions.find(o=>o.label==='عيد ميلاد');
      if(existing) existing.date = data.birthDate;
      else p.occasions.push({id:uid(), label:'عيد ميلاد', date:data.birthDate, recurring:true});
      p.birthDate = data.birthDate;
    }
    list[idx]=p; savePeople(list); return p;
  }
  function deletePerson(id){ savePeople(getPeople().filter(p=>p.id!==id)); }
  function addMemory(personId, text){
    const list=getPeople(); const p=list.find(x=>x.id===personId); if(!p) return null;
    const memory={id:uid(), text:text.trim(), date:new Date().toISOString()};
    p.memories.unshift(memory); savePeople(list); return memory;
  }
  function updateMemory(personId, memoryId, text){
    const list=getPeople(); const p=list.find(x=>x.id===personId); if(!p) return null;
    const m=p.memories.find(x=>x.id===memoryId); if(!m) return null;
    m.text=text.trim(); savePeople(list); return m;
  }
  function deleteMemory(personId, memoryId){
    const list=getPeople(); const p=list.find(x=>x.id===personId); if(!p) return;
    p.memories = p.memories.filter(x=>x.id!==memoryId); savePeople(list);
  }
  function logInteraction(personId){
    const list=getPeople(); const p=list.find(x=>x.id===personId); if(!p) return;
    p.lastContact = new Date().toISOString(); savePeople(list);
  }
  function daysSince(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
  function relativeDateLabel(iso){
    const d=daysSince(iso); if(d===null) return '';
    if(d<=0) return 'اليوم'; if(d===1) return 'أمس';
    if(d<7) return `قبل ${toArabicDigits(d)} أيام`;
    if(d<30){ const w=Math.round(d/7); return `قبل ${toArabicDigits(w)} ${w===1?'أسبوع':'أسابيع'}`; }
    if(d<365){ const m=Math.round(d/30); return `قبل ${toArabicDigits(m)} ${m===1?'شهر':'أشهر'}`; }
    const y=Math.round(d/365); return `قبل ${toArabicDigits(y)} ${y===1?'سنة':'سنوات'}`;
  }
  function memoryDateLabel(iso){
    const date=new Date(iso); const now=new Date();
    if(date.getFullYear()===now.getFullYear()){ const d=daysSince(iso); if(d<30) return relativeDateLabel(iso); }
    return toArabicDigits(date.getFullYear());
  }
  function lifeSentence(p){
    const isF = p.gender==='f'; const pronoun = isF?'ها':'ه'; const subj = isF?'قريبة':'قريب';
    if(!p.alive) return `في ذمة الله، رحم${pronoun} الله وأسكن${pronoun} فسيح جنانه`;
    if(!p.lastContact) return 'لم تتواصلا بعد — ابدأ اليوم';
    const d=daysSince(p.lastContact); const ratio=d/(p.interval_days||14);
    if(ratio<0.6) return `${subj} منك هذه الأيام 🌿`;
    if(ratio<1.1) return `اقترب وقت الاطمئنان علي${pronoun}`;
    if(ratio<2.2) return `اشتقت ل${pronoun}، اليوم فرصة جميلة`;
    return `زمان ما سمعت صوت${pronoun} — لحظة صغيرة تكفي`;
  }
  function overdueScore(p){
    if(!p.alive) return -1;
    const d = p.lastContact ? daysSince(p.lastContact) : (daysSince(p.createdAt) || 0);
    return (d/(p.interval_days||14)) * (p.importance_weight||3);
  }
  function findMostAbsent(){
    const alive=getPeople().filter(p=>p.alive); if(!alive.length) return null;
    const sorted=alive.slice().sort((a,b)=>overdueScore(b)-overdueScore(a)); const top=sorted[0];
    return overdueScore(top)>1 ? top : null;
  }
  function needsAttention(type){ return getByCategory(type).some(p=>p.alive && overdueScore(p)>1); }
  function upcomingOccasion(p, withinDays){
    withinDays = withinDays||7; const now=new Date(); let soonest=null;
    (p.occasions||[]).forEach(o=>{
      if(!o.date) return;
      const od=parseLocalDate(o.date);
      let next=new Date(now.getFullYear(), od.getMonth(), od.getDate());
      if(next<now) next=new Date(now.getFullYear()+1, od.getMonth(), od.getDate());
      const days=Math.ceil((next-now)/86400000);
      if(days<=withinDays && (!soonest || days<soonest.days)) soonest={...o, days};
    });
    if(!soonest) return null;
    const dayWord = soonest.days===0?'اليوم':soonest.days===1?'غدًا':`بعد ${toArabicDigits(soonest.days)} أيام`;
    return `🌙 ${dayWord} ${soonest.label}`;
  }
  function exportData(){
    const payload={ version:2, exportedAt:new Date().toISOString(), people:getPeople(), settings:getSettings() };
    const blob=new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url; a.download=`sila-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function importData(file, mode){
    return new Promise((resolve, reject) => {
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const data=JSON.parse(reader.result);
          if(!data || !Array.isArray(data.people)) throw new Error('صيغة الملف غير صحيحة');
          if(mode==='replace') savePeople(data.people);
          else{
            const existing=getPeople(); const existingIds=new Set(existing.map(p=>p.id));
            savePeople(existing.concat(data.people.filter(p=>!existingIds.has(p.id))));
          }
          if(data.settings) saveSettings(Object.assign(getSettings(), data.settings));
          resolve(data.people.length);
        }catch(err){ reject(err); }
      };
      reader.onerror=()=>reject(new Error('تعذّرت قراءة الملف'));
      reader.readAsText(file);
    });
  }
  function resetAll(){ localStorage.removeItem(KEYS.people); localStorage.removeItem(KEYS.settings); localStorage.removeItem(KEYS.onboarding); }
  function toast(msg){
    let host=document.getElementById('toast-host');
    if(!host){ host=document.createElement('div'); host.id='toast-host'; document.body.appendChild(host); }
    const el=document.createElement('div'); el.className='toast'; el.textContent=msg; host.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('show'));
    setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 400); }, 2400);
  }
  function confirmDialog(title, message, confirmLabel){
    return new Promise(resolve => {
      const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
      backdrop.innerHTML = `<div class="modal-sheet"><h3>${title}</h3><p>${message}</p>
        <div class="modal-actions"><button class="btn btn-ghost" data-a="cancel">إلغاء</button>
        <button class="btn btn-danger" data-a="ok">${confirmLabel||'تأكيد'}</button></div></div>`;
      document.body.appendChild(backdrop);
      requestAnimationFrame(()=>backdrop.classList.add('show'));
      function close(result){ backdrop.classList.remove('show'); setTimeout(()=>backdrop.remove(),300); resolve(result); }
      backdrop.addEventListener('click', e=>{
        if(e.target===backdrop) close(false);
        const a=e.target.closest('[data-a]'); if(a) close(a.dataset.a==='ok');
      });
    });
  }
  return {
    KEYS, CATEGORY_DEFAULTS, CATEGORY_ORDER, toArabicDigits, escapeHtml,
    getPeople, savePeople, getSettings, saveSettings,
    getPerson, getByCategory, addPerson, updatePerson, deletePerson,
    addMemory, updateMemory, deleteMemory, logInteraction,
    daysSince, relativeDateLabel, memoryDateLabel,
    lifeSentence, overdueScore, findMostAbsent, needsAttention, upcomingOccasion,
    exportData, importData, resetAll, toast, confirmDialog, uid
  };
})();
</script>

<script>

function nav(view, params={}){
  history.pushState({view, params}, '', '#'+view);
  render(view, params);
}
function replaceNav(view, params={}){
  history.replaceState({view, params}, '', '#'+view);
  render(view, params);
}
function back(){ history.back(); }
window.addEventListener('popstate', e => {
  const s = e.state || {view:'home', params:{}};
  render(s.view, s.params);
});

function callHref(p){ return `tel:${p.phone}`; }
function waHref(p){ return `https://wa.me/${(p.whatsapp||'').replace(/[^0-9]/g,'')}`; }

function render(view, params){
  window.scrollTo(0,0);
  if(view==='onboarding') return renderOnboarding();
  if(view==='home') return renderHome();
  if(view==='pickCategory') return renderPickCategory();
  if(view==='bulkAdd') return renderBulkAdd(params.type||'friends');
  if(view==='category') return renderCategory(params.type||'friends');
  if(view==='person') return renderPerson(params.id);
  if(view==='addPerson') return renderAddPerson(params.id||null, params.type||null);
  if(view==='settings') return renderSettings();
  return renderHome();
}

/* ---------------- الاستقبال الأول ---------------- */
function renderOnboarding(){
  let step = 0;
  const slides = [
    { h:'صلة وتواصل', p:'لا تدير علاقاتك... بل تعتني بها.' },
    { h:'أمانة، لا أصول تُدار', p:'كل شخص هنا له مساحته الخاصة — ذكرياته، ووقته، واهتمامك به.' },
    { h:'لحظات، لا إشعارات مزعجة', p:'سنهمس لك بلطف حين يحين وقت الاطمئنان على من تحب، لا أكثر.' }
  ];
  function paint(){
    app.innerHTML = `
      <div class="onb">
        <div>
          <div class="onb-glow"></div>
          <h1>${slides[step].h}</h1>
          <p>${slides[step].p}</p>
        </div>
        <div>
          <div class="onb-dots">${slides.map((_,i)=>`<span class="${i===step?'active':''}"></span>`).join('')}</div>
          <button class="btn btn-primary btn-block" id="nextBtn">${step===slides.length-1?'ابدأ':'التالي'}</button>
        </div>
      </div>`;
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(step < slides.length-1){ step++; paint(); }
      else{
        const s = Sila.getSettings(); s.onboardingDone = true; Sila.saveSettings(s);
        replaceNav(Sila.getPeople().length ? 'home' : 'pickCategory', {});
      }
    });
  }
  paint();
}

/* ---------------- الرئيسية ---------------- */
function renderHome(){
  const people = Sila.getPeople();
  const absent = people.length ? Sila.findMostAbsent() : null;
  const heroText = !people.length ? 'ابدأ برحلتك — أضف أول شخص يستحق الاهتمام'
    : absent ? Sila.lifeSentence(absent) : 'الجميع بخير هذه الأيام 🌿';
  const heroSub = !people.length ? '' : absent ? absent.name : 'لا أحد ينتظر اتصالك الآن';

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="addBtn">${PLUS_ICON}</button>
      <span class="topbar-title">صلة وتواصل</span>
      <button class="icon-btn" id="settingsBtn">${GEAR_ICON}</button>
    </div>
    <div class="home-hero">
      <div class="home-glow"></div>
      <p class="home-hero-text" id="heroText">${Sila.escapeHtml(heroText)}</p>
      <p class="home-hero-sub">${Sila.escapeHtml(heroSub)}</p>
    </div>
    <div class="search-box">
      ${SEARCH_ICON}
      <input type="text" id="searchInput" placeholder="ابحث عن اسم...">
    </div>
    <div id="catWrap"><div class="grid-2" id="catGrid"></div></div>
    <div id="resultsWrap" style="display:none;">
      <div class="section-label" style="padding:0 var(--sp-6) var(--sp-3);">نتائج البحث</div>
      <div class="list-wrap" id="resultsList" style="padding-top:0;"></div>
    </div>
    <div id="emptyState"></div>
  `;

  if(absent){
    document.getElementById('heroText').style.cursor = 'pointer';
    document.getElementById('heroText').addEventListener('click', () => nav('person', {id:absent.id}));
  }

  const catGrid = document.getElementById('catGrid');
  const catWrap = document.getElementById('catWrap');
  const emptyState = document.getElementById('emptyState');

  if(!people.length){
    catWrap.style.display = 'none';
    emptyState.innerHTML = `
      <div class="empty-state">
        <div class="glyph">🌿</div><h3>لا أحد هنا بعد</h3>
        <p>ابدأ بإضافة أول شخص تريد أن تحافظ على صلتك به.</p>
        <button class="btn btn-primary" id="firstAddBtn">أضف أول شخص</button>
      </div>`;
    document.getElementById('firstAddBtn').addEventListener('click', () => nav('pickCategory', {}));
  } else {
    catWrap.style.display = 'block';
    catGrid.innerHTML = Sila.CATEGORY_ORDER.map(type => {
      const def = Sila.CATEGORY_DEFAULTS[type];
      const count = Sila.getByCategory(type).length;
      const needs = Sila.needsAttention(type);
      return `<div class="cat-card ${needs?'needs-attention':''}" data-type="${type}">
        <div class="cat-dot"></div><div class="cat-name">${def.label}</div>
        <div class="cat-count">${count ? Sila.toArabicDigits(count)+' شخص' : 'لا أحد بعد'}</div>
      </div>`;
    }).join('');
    catGrid.querySelectorAll('.cat-card').forEach(el => {
      el.addEventListener('click', () => nav('category', {type: el.dataset.type}));
    });
  }

  document.getElementById('addBtn').addEventListener('click', () => nav('pickCategory', {}));
  document.getElementById('settingsBtn').addEventListener('click', () => nav('settings', {}));

  document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.trim();
    const resultsWrap = document.getElementById('resultsWrap');
    if(!q){ resultsWrap.style.display='none'; catWrap.style.display = people.length ? 'block' : 'none'; return; }
    catWrap.style.display = 'none'; resultsWrap.style.display = 'block';
    const matches = people.filter(p => p.name.includes(q));
    const list = document.getElementById('resultsList');
    if(!matches.length){
      list.innerHTML = `<div class="empty-state"><div class="glyph">🔍</div><p>لا نتائج لهذا البحث</p></div>`;
      return;
    }
    list.innerHTML = matches.map(p => personRowHtml(p)).join('');
    wirePersonRows(list);
  });
}

function personRowHtml(p){
  return `<div class="person-row" data-id="${p.id}">
    <div class="info">
      <div class="p-name">${Sila.escapeHtml(p.name)}</div>
      <div class="p-hint">${Sila.escapeHtml(Sila.lifeSentence(p))}</div>
    </div>
    <div class="quick-actions" data-actions>
      ${p.alive && p.phone ? `
        <a class="qbtn call" href="${callHref(p)}" data-log="${p.id}">${CALL_ICON}</a>
        <a class="qbtn wa" href="${waHref(p)}" target="_blank" data-log="${p.id}">${WA_ICON}</a>
      ` : ''}
    </div>
  </div>`;
}
function wirePersonRows(container){
  container.querySelectorAll('.person-row').forEach(row => {
    row.addEventListener('click', e => {
      if(e.target.closest('[data-actions]')) return;
      nav('person', {id: row.dataset.id});
    });
  });
  container.querySelectorAll('[data-log]').forEach(a => {
    a.addEventListener('click', () => Sila.logInteraction(a.dataset.log));
  });
}

/* ---------------- شاشة الفئة ---------------- */
function renderCategory(type){
  const def = Sila.CATEGORY_DEFAULTS[type];
  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="backBtn">${BACK_ICON}</button>
      <span class="topbar-title">${def ? def.label : 'الأشخاص'}</span>
      <div style="width:40px;"></div>
    </div>
    <div class="search-box" style="margin-top: var(--sp-4);">
      ${SEARCH_ICON}<input type="text" id="searchInput" placeholder="ابحث في هذه الفئة...">
    </div>
    <div class="list-wrap" id="listWrap"></div>
    <div class="add-link-wrap">
      <button class="text-link" id="addLink">${PLUS_ICON} أضف شخصًا هنا</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', back);
  document.getElementById('addLink').addEventListener('click', () => nav('bulkAdd', {type}));

  function paint(query){
    let people = Sila.getByCategory(type);
    if(query) people = people.filter(p => p.name.includes(query));
    const wrap = document.getElementById('listWrap');
    if(!people.length){
      wrap.innerHTML = query ? `<div class="empty-state"><div class="glyph">🔍</div><p>لا نتائج لهذا البحث</p></div>`
        : `<div class="empty-state"><div class="glyph">🌿</div><h3>لسه ما أضفت أحد هنا</h3>
           <p>أضف أول شخص من ${def?def.label:'هذه الفئة'} لتبدأ صلتك به.</p></div>`;
      return;
    }
    wrap.innerHTML = people.map(p => personRowHtml(p)).join('');
    wirePersonRows(wrap);
  }
  document.getElementById('searchInput').addEventListener('input', e => paint(e.target.value.trim()));
  paint('');
}

/* ---------------- اختيار الفئة قبل الإضافة الجماعية ---------------- */
function renderPickCategory(){
  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="backBtn">${BACK_ICON}</button>
      <span class="topbar-title">أضف أشخاصًا</span>
      <div style="width:40px;"></div>
    </div>
    <div class="bulk-intro">
      <h2>من تريد أن تضيف؟</h2>

    </div>
    <div class="grid-2" id="pickGrid"></div>

/* ---------------- إضافة جماعية سريعة (تستبدل إضافة شخص واحد تلو الآخر) ---------------- */
function renderBulkAdd(type){
  const def = Sila.CATEGORY_DEFAULTS[type] || Sila.CATEGORY_DEFAULTS.friends;
  const isSiblings = type === 'siblings';
  const isParents = type === 'parents';
  let step = isParents ? 2 : 1;
  const counts = { m:0, f:0, count:1 };

  function topbarHtml(){
    return `
    <div class="topbar">
      <button class="icon-btn" id="backBtn">${BACK_ICON}</button>
      <span class="topbar-title">${def.label}</span>
      <div style="width:40px;"></div>
    </div>`;
  }

  function paintStep1(){
    let rows = '';
    if(isSiblings){
      rows = `
        <div class="stepper-row">
          <span class="stepper-label">كم أخ لديك؟</span>
          <div class="stepper"><button data-a="dec-m">−</button><span class="stepper-val" id="valM">٠</span><button data-a="inc-m">+</button></div>
        </div>
        <div class="stepper-row">
          <span class="stepper-label">كم أخت لديك؟</span>
          <div class="stepper"><button data-a="dec-f">−</button><span class="stepper-val" id="valF">٠</span><button data-a="inc-f">+</button></div>
        </div>`;
    } else {
      rows = `
        <div class="stepper-row">
          <span class="stepper-label">كم شخص تريد إضافته؟</span>
          <div class="stepper"><button data-a="dec-c">−</button><span class="stepper-val" id="valC">١</span><button data-a="inc-c">+</button></div>
        </div>`;
    }
    app.innerHTML = topbarHtml() + `
      <div class="bulk-intro"><h2>${def.label}</h2><p>حدد العدد، وبعدين نجهز لك الحقول كلها دفعة واحدة.</p></div>
      <div class="bulk-wrap" style="padding-top:0;">
        ${rows}
        <button class="btn btn-primary btn-block" id="nextBtn" style="margin-top:var(--sp-8);">التالي</button>
      </div>`;
    document.getElementById('backBtn').addEventListener('click', back);

    function refreshVals(){
      if(isSiblings){
        document.getElementById('valM').textContent = Sila.toArabicDigits(counts.m);
        document.getElementById('valF').textContent = Sila.toArabicDigits(counts.f);
      } else {
        document.getElementById('valC').textContent = Sila.toArabicDigits(counts.count);
      }
    }
    app.querySelectorAll('[data-a]').forEach(btn => {
      btn.addEventListener('click', () => {
        const a = btn.dataset.a;
        if(a==='inc-m') counts.m = Math.min(15, counts.m+1);
        if(a==='dec-m') counts.m = Math.max(0, counts.m-1);
        if(a==='inc-f') counts.f = Math.min(15, counts.f+1);
        if(a==='dec-f') counts.f = Math.max(0, counts.f-1);
        if(a==='inc-c') counts.count = Math.min(30, counts.count+1);
        if(a==='dec-c') counts.count = Math.max(1, counts.count-1);
        refreshVals();
      });
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if(isSiblings && counts.m===0 && counts.f===0){ Sila.toast('اختر عددًا واحدًا على الأقل'); return; }
      step = 2; paintStep2();
    });
  }

  async function importFromContacts(){
    if(!('contacts' in navigator && window.ContactsManager)){
      Sila.toast('هذه الميزة غير مدعومة على متصفحك حاليًا — قريبًا إن شاء الله');
      return;
    }
    try{
      const contacts = await navigator.contacts.select(['name','tel'], {multiple:true});
      const inputs = Array.from(document.querySelectorAll('.bulk-input, .parent-field input:not(:disabled)'));
      let i = 0;
      contacts.forEach(c => {
        if(i >= inputs.length) return;
        const name = (c.name && c.name[0]) || '';
        if(!name) return;
        inputs[i].value = name;
        inputs[i].dataset.phone = (c.tel && c.tel[0]) || '';
        i++;
      });
      if(i) Sila.toast(`تم استيراد ${Sila.toArabicDigits(i)} من جهات الاتصال`);
    }catch(err){ /* المستخدم ألغى الاختيار */ }
  }

  function importBtnHtml(){
    const supported = ('contacts' in navigator && window.ContactsManager);
    return `<button class="contact-import-btn ${supported?'':'disabled'}" id="importBtn">
      ${CONTACTS_ICON} استيراد من جهات الاتصال ${supported?'':'<span class="soon-badge">قريبًا</span>'}
    </button>`;
  }

  function paintStep2(){
    let fieldsHtml = '';
    if(isParents){
      fieldsHtml = `
        <div class="parent-row">
          <label class="switch"><input type="checkbox" id="fatherOn" checked><span class="track"></span><span class="thumb"></span></label>
          <div class="parent-field"><label>الأب</label><input type="text" id="fatherName" placeholder="اسم الأب"></div>
        </div>
        <div class="parent-row">
          <label class="switch"><input type="checkbox" id="motherOn" checked><span class="track"></span><span class="thumb"></span></label>
          <div class="parent-field"><label>الأم</label><input type="text" id="motherName" placeholder="اسم الأم"></div>
        </div>`;
    } else if(isSiblings){
      let m = ''; for(let i=1;i<=counts.m;i++) m += `<div class="bulk-name-row"><span class="bulk-order">${Sila.toArabicDigits(i)}</span><input type="text" placeholder="اسم الأخ" class="bulk-input" data-gender="m"></div>`;
      let f = ''; for(let i=1;i<=counts.f;i++) f += `<div class="bulk-name-row"><span class="bulk-order">${Sila.toArabicDigits(i)}</span><input type="text" placeholder="اسم الأخت" class="bulk-input" data-gender="f"></div>`;
      fieldsHtml = `${counts.m?`<div class="bulk-group-label">الإخوة</div>${m}`:''}${counts.f?`<div class="bulk-group-label">الأخوات</div>${f}`:''}`;
    } else {
      const placeholder = type==='relatives' ? 'اسم القريب' : type==='coworkers' ? 'اسم الزميل' : 'اسم الصديق';
      let rows = ''; for(let i=1;i<=counts.count;i++) rows += `<div class="bulk-name-row"><span class="bulk-order">${Sila.toArabicDigits(i)}</span><input type="text" placeholder="${placeholder}" class="bulk-input"></div>`;
      fieldsHtml = rows;
    }

    app.innerHTML = topbarHtml() + `
      <div class="bulk-wrap" style="padding-top:var(--sp-4);">
        ${importBtnHtml()}
        ${fieldsHtml}
        <button class="btn btn-primary btn-block" id="saveBtn" style="margin-top:var(--sp-6);">حفظ</button>
      </div>`;

    document.getElementById('backBtn').addEventListener('click', () => {
      if(isParents){ back(); } else { step = 1; paintStep1(); }
    });

    if(isParents){
      const fOn = document.getElementById('fatherOn'), fName = document.getElementById('fatherName');
      const mOn = document.getElementById('motherOn'), mName = document.getElementById('motherName');
      fOn.addEventListener('change', () => { fName.disabled = !fOn.checked; });
      mOn.addEventListener('change', () => { mName.disabled = !mOn.checked; });
    }

    document.getElementById('importBtn').addEventListener('click', importFromContacts);

    document.getElementById('saveBtn').addEventListener('click', () => {
      let created = 0;
      if(isParents){
        const fOn = document.getElementById('fatherOn').checked;
        const fNameEl = document.getElementById('fatherName');
        const mOn = document.getElementById('motherOn').checked;
        const mNameEl = document.getElementById('motherName');
        if(fOn && fNameEl.value.trim()){ Sila.addPerson({name:fNameEl.value.trim(), relationship_type:'parents', gender:'m', phone:fNameEl.dataset.phone||''}); created++; }
        if(mOn && mNameEl.value.trim()){ Sila.addPerson({name:mNameEl.value.trim(), relationship_type:'parents', gender:'f', phone:mNameEl.dataset.phone||''}); created++; }
      } else {
        document.querySelectorAll('.bulk-input').forEach(input => {
          const name = input.value.trim();
          if(!name) return;
          Sila.addPerson({ name, relationship_type:type, gender: input.dataset.gender || '', phone: input.dataset.phone || '' });
          created++;
        });
      }
      if(!created){ Sila.toast('اكتب اسمًا واحدًا على الأقل'); return; }
      Sila.toast(created===1 ? 'تمت إضافة شخص واحد' : `تمت إضافة ${Sila.toArabicDigits(created)} أشخاص`);
      replaceNav('category', {type});
    });
  }

  if(step===1) paintStep1(); else paintStep2();
}

function renderAddPerson(editId, presetType){
  const person = editId ? Sila.getPerson(editId) : null;
  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="backBtn">${BACK_ICON}</button>
      <span class="topbar-title">${person?'تعديل':'أضف شخصًا'}</span>
      <div style="width:40px;"></div>
    </div>
    <div class="form-wrap">
      <div class="field">
        <label>الاسم</label>
        <input type="text" id="fName" placeholder="اسم الشخص">
        <div class="error">الاسم مطلوب</div>
      </div>
      <div class="field">
        <label>الفئة</label>
        <select id="fType">
          <option value="parents">الوالدان</option><option value="siblings">الإخوة</option>
          <option value="relatives">الأقارب</option><option value="friends">الأصدقاء</option>
          <option value="coworkers">زملاء العمل</option>
        </select>
      </div>
      <div class="field">
        <label>الجنس (لصياغة الجمل بشكل صحيح)</label>
        <div class="chip-group" id="genderChips">
          <div class="chip" data-v="m">هو</div><div class="chip" data-v="f">هي</div>
        </div>
      </div>
      <div class="field">
        <label>رقم الهاتف</label>
        <input type="tel" id="fPhone" placeholder="05xxxxxxxx">
        <div class="error">رقم الهاتف غير صحيح</div>
      </div>
      <div class="field">
        <label>تاريخ الميلاد (اختياري)</label>
        <input type="date" id="fBirth">
      </div>
      <div class="switch-row">
        <span style="font-size:14.5px; color:var(--ink-soft);">على قيد الحياة</span>
        <label class="switch"><input type="checkbox" id="fAlive" checked><span class="track"></span><span class="thumb"></span></label>
      </div>
      <div class="field" style="margin-top:var(--sp-5);">
        <label>كل كم يوم تريد الاطمئنان عليه/ها؟</label>
        <input type="number" id="fInterval" min="1">
      </div>
      <div class="field">
        <label>درجة الأهمية (تحدد من يظهر أولًا عند الحاجة للاطمئنان)</label>
        <select id="fWeight">
          <option value="1">١ — بسيطة</option><option value="2">٢</option><option value="3">٣ — متوسطة</option>
          <option value="4">٤</option><option value="5">٥ — عالية</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="saveBtn" style="margin-top:var(--sp-6);">حفظ</button>
    </div>
    <div class="danger-zone" id="dangerZone" style="display:none;">
      <div class="divider" style="margin:0 0 var(--sp-6);"></div>
      <button class="text-link danger" id="deleteBtn">${TRASH_ICON} حذف هذا الشخص نهائيًا</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', back);

  if(presetType) document.getElementById('fType').value = presetType;
  document.getElementById('fWeight').value = Sila.CATEGORY_DEFAULTS[presetType||'friends'].weight;
  if(person){
    document.getElementById('fName').value = person.name;
    document.getElementById('fType').value = person.relationship_type;
    document.getElementById('fPhone').value = person.phone;
    document.getElementById('fBirth').value = person.birthDate||'';
    document.getElementById('fAlive').checked = person.alive;
    document.getElementById('fInterval').value = person.interval_days;
    document.getElementById('fWeight').value = person.importance_weight;
    document.getElementById('dangerZone').style.display = 'block';
    if(person.gender) document.querySelectorAll('#genderChips .chip').forEach(c => c.classList.toggle('active', c.dataset.v===person.gender));
  } else {
    document.getElementById('fInterval').value = Sila.CATEGORY_DEFAULTS[presetType||'friends'].interval;
  }

  document.getElementById('fType').addEventListener('change', e => {
    if(person) return;
    const d = Sila.CATEGORY_DEFAULTS[e.target.value];
    document.getElementById('fInterval').value = d.interval;
    document.getElementById('fWeight').value = d.weight;
  });

  document.querySelectorAll('#genderChips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const was = chip.classList.contains('active');
      document.querySelectorAll('#genderChips .chip').forEach(c => c.classList.remove('active'));
      if(!was) chip.classList.add('active');
    });
  });
  function selectedGender(){ const a = document.querySelector('#genderChips .chip.active'); return a ? a.dataset.v : ''; }

  function validate(){
    document.querySelectorAll('.field').forEach(f => f.classList.remove('has-error'));
    let ok = true;
    if(!document.getElementById('fName').value.trim()){ document.getElementById('fName').closest('.field').classList.add('has-error'); ok=false; }
    const phone = document.getElementById('fPhone').value.trim();
    if(phone && !/^[0-9+\s-]{6,}$/.test(phone)){ document.getElementById('fPhone').closest('.field').classList.add('has-error'); ok=false; }
    return ok;
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    if(!validate()) return;
    const type = document.getElementById('fType').value;
    const def = Sila.CATEGORY_DEFAULTS[type];
    const data = {
      name: document.getElementById('fName').value, relationship_type: type, gender: selectedGender(),
      phone: document.getElementById('fPhone').value.trim(), whatsapp: document.getElementById('fPhone').value.trim(),
      alive: document.getElementById('fAlive').checked, birthDate: document.getElementById('fBirth').value,
      importance_weight: +document.getElementById('fWeight').value || def.weight,
      interval_days: +document.getElementById('fInterval').value || def.interval
    };
    let saved;
    if(person){ saved = Sila.updatePerson(person.id, data); Sila.toast('تم حفظ التعديلات'); }
    else{ saved = Sila.addPerson(data); Sila.toast('تمت الإضافة'); }
    nav('person', {id: saved.id});
  });

  document.getElementById('deleteBtn')?.addEventListener('click', async () => {
    const ok = await Sila.confirmDialog('حذف نهائي', `سيتم حذف "${Sila.escapeHtml(person.name)}" وكل ذكرياتك معه/ها نهائيًا. لا يمكن التراجع عن هذا الإجراء.`, 'نعم، احذف');
    if(ok){ Sila.deletePerson(person.id); Sila.toast('تم الحذف'); nav('home', {}); }
  });
}

/* ---------------- الغرفة الهادئة (شاشة الشخص) ---------------- */
function renderPerson(id){
  let person = Sila.getPerson(id);
  if(!person){
    app.innerHTML = `<div class="empty-state"><div class="glyph">🌿</div><h3>لم نجد هذا الشخص</h3>
      <p>ربما تم حذفه من قبل.</p><button class="btn btn-primary" id="homeBtn">العودة للرئيسية</button></div>`;
    document.getElementById('homeBtn').addEventListener('click', () => nav('home', {}));
    return;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="backBtn">${BACK_ICON}</button>
      <div class="whisper" id="whisper" style="display:none;"></div>
      <button class="icon-btn" id="editBtn">${EDIT_ICON}</button>
    </div>
    <div class="p-hero">
      <div class="p-glow" id="glow"></div>
      <h1 class="p-name" id="pName">—</h1>
      <p class="p-life-sentence" id="pLifeSentence">—</p>
    </div>
    <div class="p-actions" id="actions"></div>
    <div class="divider"></div>
    <div class="memories-section">
      <div class="section-label">ذكريات</div>
      <div id="memoriesList"></div>
      <button class="text-link" id="addMemoryToggle">${PLUS_ICON} أضف ذكرى</button>
      <div class="add-memory-box" id="addMemoryBox">
        <div class="field" style="margin-bottom:var(--sp-3);"><textarea id="memoryInput" placeholder="اكتب لحظة تستحق أن تُحفظ..."></textarea></div>
        <div class="modal-actions"><button class="btn btn-ghost" id="cancelMemory">إلغاء</button><button class="btn btn-primary" id="saveMemory">احفظ</button></div>
      </div>
    </div>
    <div class="overlay" id="overlay"><p id="overlayText"></p></div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => nav('home', {}));
  document.getElementById('editBtn').addEventListener('click', () => nav('addPerson', {id: person.id}));

  const el = {
    glow: document.getElementById('glow'), name: document.getElementById('pName'),
    lifeSentence: document.getElementById('pLifeSentence'), whisper: document.getElementById('whisper'),
    actions: document.getElementById('actions'), memoriesList: document.getElementById('memoriesList'),
    overlay: document.getElementById('overlay'), overlayText: document.getElementById('overlayText')
  };

  function glowFor(p){
    if(!p.alive) return 'rgba(110,128,101,0.14)';
    const d = p.lastContact ? Sila.daysSince(p.lastContact) : 999;
    const ratio = d/(p.interval_days||14);
    if(ratio<0.6) return 'rgba(201,138,62,0.26)';
    if(ratio<1.5) return 'rgba(201,138,62,0.16)';
    return 'rgba(110,128,101,0.14)';
  }

  function paint(){
    person = Sila.getPerson(id);
    el.glow.style.setProperty('--glow-color', glowFor(person));
    el.name.textContent = person.name;
    el.lifeSentence.textContent = Sila.lifeSentence(person);
    const w = Sila.upcomingOccasion(person);
    if(w){ el.whisper.style.display='block'; el.whisper.textContent=w; } else { el.whisper.style.display='none'; }

    el.actions.innerHTML = person.alive ? (person.phone ? `
      <button class="btn btn-primary" id="callBtn">${CALL_ICON} اتصال</button>
      <button class="btn btn-whatsapp" id="waBtn">${WA_ICON} واتساب</button>
    ` : `<button class="btn btn-ghost btn-block" id="noPhoneBtn">${PLUS_ICON} أضف رقم هاتف للتواصل</button>`)
    : `<button class="btn btn-dua" id="duaBtn">${DUA_ICON} ادعُ له/لها</button>`;

    paintMemories();

    if(person.alive && person.phone){
      document.getElementById('callBtn').addEventListener('click', () => {
        Sila.logInteraction(person.id); window.location.href = callHref(person);
        quietMoment('لحظة جميلة قضيتها معه/ا. احتفظ بها.');
      });
      document.getElementById('waBtn').addEventListener('click', () => {
        Sila.logInteraction(person.id); window.open(waHref(person), '_blank');
        quietMoment('رسالة صغيرة قد تعني له/ا الكثير.');
      });
    } else if(person.alive){
      document.getElementById('noPhoneBtn').addEventListener('click', () => nav('addPerson', {id: person.id}));
    } else {
      document.getElementById('duaBtn').addEventListener('click', () => quietMoment('دعوة صادقة تصل. رحمه الله.'));
    }
  }

  function paintMemories(){
    if(!person.memories.length){
      el.memoriesList.innerHTML = `<p style="font-size:14px; color:var(--ink-faint); line-height:1.8;">لا ذكريات بعد — أول لحظة تكتبها هنا تبقى.</p>`;
      return;
    }
    el.memoriesList.innerHTML = person.memories.map(m => `
      <div class="memory-row" data-id="${m.id}">
        <div class="memory-date">${Sila.memoryDateLabel(m.date)}</div>
        <div class="memory-body">
          <div class="memory-text">${Sila.escapeHtml(m.text)}</div>
          <div class="memory-tools"><button data-a="edit">تعديل</button><button data-a="delete" class="danger">حذف</button></div>
        </div>
      </div>`).join('');
    el.memoriesList.querySelectorAll('[data-a="edit"]').forEach(btn => btn.addEventListener('click', () => startEditMemory(btn.closest('.memory-row'))));
    el.memoriesList.querySelectorAll('[data-a="delete"]').forEach(btn => btn.addEventListener('click', async () => {
      const row = btn.closest('.memory-row');
      const ok = await Sila.confirmDialog('حذف الذكرى', 'لا يمكن التراجع عن حذف هذه الذكرى.', 'احذف');
      if(ok){ Sila.deleteMemory(person.id, row.dataset.id); Sila.toast('تم حذف الذكرى'); paint(); }
    }));
  }

  function startEditMemory(row){
    const memId = row.dataset.id; const mem = person.memories.find(m => m.id===memId);
    row.querySelector('.memory-body').innerHTML = `
      <div><textarea style="width:100%; border:1px solid var(--divider); border-radius:12px; padding:12px; font-family:'Tajawal',sans-serif; font-size:14.5px; min-height:64px;">${Sila.escapeHtml(mem.text)}</textarea>
      <div class="modal-actions" style="margin-top:8px;"><button class="btn btn-ghost" data-a="cancel-edit">إلغاء</button><button class="btn btn-primary" data-a="save-edit">حفظ</button></div></div>`;
    row.querySelector('[data-a="save-edit"]').addEventListener('click', () => {
      const text = row.querySelector('textarea').value.trim(); if(!text) return;
      Sila.updateMemory(person.id, memId, text); Sila.toast('تم تحديث الذكرى'); paint();
    });
    row.querySelector('[data-a="cancel-edit"]').addEventListener('click', paint);
  }

  function quietMoment(text){
    el.overlayText.textContent = text; el.overlay.classList.add('show');
    setTimeout(() => el.overlay.classList.remove('show'), 2200);
    paint();
  }

  const toggle = document.getElementById('addMemoryToggle');
  const box = document.getElementById('addMemoryBox');
  const input = document.getElementById('memoryInput');
  toggle.addEventListener('click', () => { box.classList.add('open'); toggle.style.display='none'; setTimeout(()=>input.focus(),200); });
  document.getElementById('cancelMemory').addEventListener('click', () => { box.classList.remove('open'); toggle.style.display='flex'; input.value=''; });
  document.getElementById('saveMemory').addEventListener('click', () => {
    const text = input.value.trim(); if(!text) return;
    Sila.addMemory(person.id, text); Sila.toast('تم حفظ الذكرى');
    box.classList.remove('open'); toggle.style.display='flex'; input.value=''; paint();
  });

  paint();
}

  const fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {

      mode = replace ? 'replace' : 'merge';
    }
    try{ const count = await Sila.importData(file, mode); Sila.toast(`تم استيراد ${Sila.toArabicDigits(count)} شخص`); }
    catch(err){ Sila.toast('تعذّر استيراد الملف — تأكد أنه نسخة صحيحة'); }
    fileInput.value = '';
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    const ok = await Sila.confirmDialog('حذف كل البيانات', 'سيتم حذف كل الأشخاص والذكريات والإعدادات نهائيًا. هذا الإجراء لا يمكن التراجع عنه.', 'نعم، احذف كل شيء');
    if(ok){ Sila.resetAll(); Sila.toast('تم حذف كل البيانات'); setTimeout(() => replaceNav('onboarding', {}), 800); }
  });
}

/* ---------------- نقطة البداية ---------------- */
(function start(){
  const s = Sila.getSettings();
  if(!s.onboardingDone){ replaceNav('onboarding', {}); return; }
  replaceNav('home', {});
})();
</script>
